on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate build timestamp
        run: |
          echo "BUILD_TIME=$(date +%s)" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
      
      - name: Update cache-busting version
        run: |
          # 使用提交哈希和时间戳创建唯一版本号
          VERSION="${COMMIT_SHA}-${BUILD_TIME}"
          echo "Generated version: $VERSION"
          
          # 更新所有HTML文件中的资源引用
          find . -name "*.html" -type f -exec sed -i "s/\(\.css\|\.js\)\(\?v=[^\"']*\)\?/\1?v=$VERSION/g" {} \;
          
          # 确保script.js中的JSON请求也包含版本号
          sed -i "s/\(\${jsonPath}\)\(\?v=[^`]*\)\?/\1?v=$VERSION/g" script.js
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4