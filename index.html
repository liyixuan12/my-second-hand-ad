<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>达姆出二手 | Darmstadt Second Hand | Darmstadt Gebraucht</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .language-selector {
            text-align: center;
            max-width: 700px;
            padding: 2rem;
        }

        .main-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        .info {
            font-size: 1rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .language-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .language-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .language-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .language-flag {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }

        .language-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .language-desc {
            font-size: 1rem;
            opacity: 0.85;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }

            .language-options {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .language-selector {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 2rem;
            }

            .language-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <h1 class="main-title">达姆出二手</h1>

        <p class="subtitle">
            选择语言 / Choose Your Language / Sprache wählen
        </p>

        <p class="info">
            📍 Darmstadt ｜ All items are pickup only ｜ WhatsApp: +49 XXX XXX XXXX
        </p>

        <div class="language-options">
            <a href="zh/" class="language-card">
                <span class="language-flag">🇨🇳</span>
                <div class="language-name">中文</div>
                <div class="language-desc">查看中文商品页面</div>
            </a>

            <a href="en/" class="language-card">
                <span class="language-flag">🇬🇧</span>
                <div class="language-name">English</div>
                <div class="language-desc">Browse items in English</div>
            </a>

            <a href="de/" class="language-card">
                <span class="language-flag">🇩🇪</span>
                <div class="language-name">Deutsch</div>
                <div class="language-desc">Artikel auf Deutsch ansehen</div>
            </a>
        </div>
    </div>
</body>
</html>
